name: Validar painel
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  dados:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python atualizar.py
      - run: python -m unittest discover -s tests -v
      - run: node scripts/check-javascript.cjs
      - run: git diff --exit-code -- index.html js/indicadores.js js/viabilidade-dados.js
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: python atualizar.py
      - name: Testar aplicação por HTTP
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/coe-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 0.2
          done
          pnpm run test:browser
