<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COE Holambra</title>
<link rel="icon" type="image/svg+xml" href="img/marca/holambra-moinho.svg">
<meta name="description" content="Painel do Centro Operacional de Excelência Holambra: objetivos, indicadores, infraestrutura, viabilidade, governança e roadmap.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>
(function(){var t=null;try{t=localStorage.getItem('coe:tema')}catch(e){}
if(t!=='light'&&t!=='dark')t='light';
document.documentElement.dataset.theme=t;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/painel.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<div class="veu" id="veu" hidden></div>

<div class="palco">
  <header class="barra-topo">
    <a class="marca" href="#inicio" aria-label="COE Holambra — início">
      <span class="marca-selo"><img class="marca-clara" src="img/marca/holambra.svg" alt="" width="239" height="60" decoding="async"><img class="marca-escura" src="img/marca/holambra-escuro.svg" alt="" width="239" height="60" decoding="async"></span>
      <b>COE</b>
    </a>
    <nav class="trilho" id="trilho" aria-label="Etapas do projeto"><ol class="etapas" id="etapas"></ol></nav>
    <div class="ferramentas">
      <button type="button" class="busca-abrir" id="abrirBusca" title="Buscar (Ctrl K)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <span>Buscar no painel</span>
      </button>
      <button type="button" id="btTema" aria-label="Trocar tema" title="Trocar entre claro e escuro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500Z"/></svg>
      </button>
      <button type="button" id="btCheia" aria-label="Tela cheia" title="Tela cheia (tecla F)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button type="button" class="menu" id="btMenu" aria-label="Abrir menu" aria-expanded="false" aria-controls="trilho">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>
  <div class="migalha"><p id="migalha"></p><span id="posicao"></span></div>
  <main id="conteudo" tabindex="-1">
{{PAGINAS}}
  </main>
  <nav class="passos-fixos" id="passos" aria-label="Página anterior e próxima"></nav>
  <footer class="rodape"><div class="rodape-id"><a class="rodape-marca" href="#inicio" aria-label="Holambra — Cooperativa Agroindustrial — voltar ao início"><img class="marca-clara" src="img/marca/holambra.svg" alt="" width="239" height="60" loading="lazy" decoding="async"><img class="marca-escura" src="img/marca/holambra-escuro.svg" alt="" width="239" height="60" loading="lazy" decoding="async"></a><small>COE · Documento de classificação restrita</small></div><p class="rodape-autoria">Elaborado pela <strong>KPMG</strong> para a Cooperativa Agroindustrial Holambra</p><button type="button" id="btTopo">Voltar ao topo</button></footer>
</div>

<div class="dica" id="dica" hidden></div>
<noscript><p class="sem-js">Ative o JavaScript para navegar pelo painel. Os dados e as fontes estão disponíveis neste repositório.</p></noscript>

<dialog class="telao" id="telao" aria-label="Tela do videowall">
  <header>
    <div><b id="telaoNome"></b><span id="telaoSub"></span></div>
    <span class="conta" id="telaoConta"></span>
  </header>
  <div class="telao-q"><div class="tv-tela" id="telaoTela"></div></div>
  <footer>
    <button type="button" data-a="anterior">Tela anterior</button>
    <button type="button" data-a="proxima">Próxima tela</button>
    <a id="telaoLink" target="_blank" rel="noopener">Abrir em outra aba</a>
    <button type="button" data-a="fechar">Fechar</button>
  </footer>
</dialog>

<dialog class="lente" id="lente" aria-label="Imagem ampliada">
  <header><b id="lenteNome"></b><span class="conta" id="lenteConta"></span></header>
  <img id="lenteImg" alt="">
  <footer>
    <button type="button" data-a="anterior">Anterior</button>
    <button type="button" data-a="proxima">Próxima</button>
    <button type="button" data-a="fechar">Fechar</button>
  </footer>
</dialog>

<dialog class="busca" id="busca" aria-label="Buscar no painel">
  <input id="buscaCampo" type="search" placeholder="Busque uma página, um indicador ou um ID" autocomplete="off" aria-label="Buscar" aria-controls="buscaLista">
  <ul id="buscaLista"></ul>
</dialog>

<script id="estrutura" type="application/json">{{ESTRUTURA}}</script>
<script src="js/indicadores.js"></script>
<script src="js/viabilidade-dados.js"></script>
<script src="js/arquitetura.js"></script>
<script src="js/viabilidade.js"></script>
<script src="js/painel.js"></script>
<script src="js/home.js"></script>
</body>
</html>
